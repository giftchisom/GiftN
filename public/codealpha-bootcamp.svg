<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&amp;family=Montserrat:wght@400;600;700;800;900&amp;family=Playfair+Display:ital,wght@1,600;1,700&amp;display=swap');
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="850" fill="#ffffff" />

  <!-- Diagonal Orange Corner Triangles -->
  <polygon points="0,0 20,0 20,120 0,100" fill="#f97316" />
  <polygon points="0,0 120,0 100,20 0,20" fill="#f97316" />
  
  <polygon points="1200,850 1180,850 1180,730 1200,750" fill="#f97316" />
  <polygon points="1200,850 1080,850 1100,830 1200,830" fill="#f97316" />

  <!-- Inner Black Framing Border -->
  <rect x="35" y="35" width="1130" height="780" fill="none" stroke="#090a0f" stroke-width="6" />

  <!-- TOP LEFT: CODEALPHA LOGO -->
  <g transform="translate(60, 60)">
    <!-- Globe/Sphere Grid Icon -->
    <g transform="translate(10, 15)">
      <!-- Outer grid sphere -->
      <circle cx="28" cy="28" r="26" fill="none" stroke="#2563eb" stroke-width="1.8" />
      <ellipse cx="28" cy="28" rx="26" ry="12" fill="none" stroke="#2563eb" stroke-width="1.2" />
      <ellipse cx="28" cy="28" rx="12" ry="26" fill="none" stroke="#2563eb" stroke-width="1.2" />
      <line x1="2" y1="28" x2="54" y2="28" stroke="#2563eb" stroke-width="1.2" />
      <line x1="28" y1="2" x2="28" y2="54" stroke="#2563eb" stroke-width="1.2" />
      <!-- Dotted grid effect -->
      <circle cx="20" cy="18" r="1.5" fill="#3b82f6" />
      <circle cx="36" cy="18" r="1.5" fill="#3b82f6" />
      <circle cx="20" cy="38" r="1.5" fill="#3b82f6" />
      <circle cx="36" cy="38" r="1.5" fill="#3b82f6" />
      <circle cx="28" cy="28" r="2.5" fill="#1d4ed8" />
    </g>

    <text x="75" y="38" font-family="'Montserrat', sans-serif" font-size="28" font-weight="900" fill="#1e3a8a" letter-spacing="1">
      CODE
    </text>
    <text x="75" y="58" font-family="'Montserrat', sans-serif" font-size="16" font-weight="800" fill="#2563eb" letter-spacing="3">
      ALPHA
    </text>
    <text x="75" y="74" font-family="'Montserrat', sans-serif" font-size="8" font-weight="700" fill="#334155" letter-spacing="1">
      YOUR DREAM OUR PASSION
    </text>
  </g>

  <!-- TOP RIGHT: QR CODE & STUDENT ID -->
  <g transform="translate(1010, 60)">
    <!-- QR Code Graphic Mockup -->
    <rect x="35" y="0" width="85" height="85" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <!-- QR Finder patterns -->
    <!-- Top-left -->
    <rect x="42" y="7" width="22" height="22" fill="#000000" />
    <rect x="46" y="11" width="14" height="14" fill="#ffffff" />
    <rect x="49" y="14" width="8" height="8" fill="#000000" />
    <!-- Top-right -->
    <rect x="91" y="7" width="22" height="22" fill="#000000" />
    <rect x="95" y="11" width="14" height="14" fill="#ffffff" />
    <rect x="98" y="14" width="8" height="8" fill="#000000" />
    <!-- Bottom-left -->
    <rect x="42" y="56" width="22" height="22" fill="#000000" />
    <rect x="46" y="60" width="14" height="14" fill="#ffffff" />
    <rect x="49" y="63" width="8" height="8" fill="#000000" />
    <!-- Data points -->
    <rect x="70" y="10" width="5" height="12" fill="#000000" />
    <rect x="78" y="18" width="6" height="6" fill="#000000" />
    <rect x="70" y="34" width="16" height="16" fill="#000000" />
    <rect x="42" y="38" width="8" height="8" fill="#000000" />
    <rect x="92" y="38" width="12" height="8" fill="#000000" />
    <rect x="72" y="58" width="8" height="14" fill="#000000" />
    <rect x="88" y="58" width="18" height="16" fill="#000000" />

    <!-- Student ID Text -->
    <text x="77" y="105" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="11" font-weight="700" fill="#0f172a">
      Student ID:CA/DF1/91356
    </text>
  </g>

  <!-- CENTER TITLE: CERTIFICATE OF COMPLETION -->
  <g text-anchor="middle" transform="translate(600, 195)">
    <text x="0" y="0" font-family="'Montserrat', sans-serif" font-size="52" font-weight="900" fill="#0f172a" letter-spacing="6">
      CERTIFICATE
    </text>
    
    <!-- Underline bar with "OF COMPLETION" -->
    <g transform="translate(0, 32)">
      <line x1="-260" y1="-7" x2="-100" y2="-7" stroke="#64748b" stroke-width="2" />
      <text x="0" y="0" font-family="'Montserrat', sans-serif" font-size="24" font-weight="700" fill="#1e293b" letter-spacing="5">
        OF COMPLETION
      </text>
      <line x1="100" y1="-7" x2="260" y2="-7" stroke="#64748b" stroke-width="2" />
    </g>

    <text x="0" y="95" font-family="'Montserrat', sans-serif" font-size="20" font-weight="600" fill="#0f172a" letter-spacing="1">
      This Certificate Is Proudly Presented To
    </text>
  </g>

  <!-- RECIPIENT NAME (Calligraphy Script) -->
  <g text-anchor="middle" transform="translate(600, 395)">
    <text x="0" y="0" font-family="'Great Vibes', 'Playfair Display', cursive, serif" font-size="58" font-style="italic" font-weight="700" fill="#090d16">
      Gift Chisom Nneji Ohanogu
    </text>
  </g>

  <!-- BODY DESCRIPTION -->
  <g text-anchor="middle" transform="translate(600, 480)">
    <text x="0" y="0" font-family="'Montserrat', sans-serif" font-size="17" font-weight="500" fill="#1e293b">
      Was an active Participant at CodeAlpha Virtual Internship Program in Full Stack
    </text>
    <text x="0" y="32" font-family="'Montserrat', sans-serif" font-size="17" font-weight="500" fill="#1e293b">
      Development Internship with dedication and hard work. We really appreciate your efforts
    </text>
    <text x="0" y="64" font-family="'Montserrat', sans-serif" font-size="17" font-weight="500" fill="#1e293b">
      taken and wish you all the best for the further.
    </text>
    <text x="0" y="104" font-family="'Montserrat', sans-serif" font-size="18" font-weight="700" fill="#0f172a">
      1st June 2026 to 30th June 2026
    </text>
  </g>

  <!-- FOOTER SECTION (Signatures & MSME Verification) -->
  <!-- Left: CEO & Founder Signature -->
  <g transform="translate(230, 715)">
    <text x="0" y="-18" text-anchor="middle" font-family="'Great Vibes', cursive" font-size="34" font-style="italic" fill="#0f172a">
      Swati Sri
    </text>
    <line x1="-90" y1="0" x2="90" y2="0" stroke="#090a0f" stroke-width="2" />
    <text x="0" y="28" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="17" font-weight="800" fill="#090a0f" letter-spacing="1">
      CEO &amp; Founder
    </text>
  </g>

  <!-- Center: Date of Issue -->
  <g transform="translate(600, 715)">
    <text x="0" y="-14" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="16" font-weight="800" fill="#090a0f">
      1st July 2026
    </text>
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#090a0f" stroke-width="2" />
    <text x="0" y="28" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="16" font-weight="700" fill="#090a0f">
      Date of Issue
    </text>
  </g>

  <!-- Right: MSME & Government of India Emblem -->
  <g transform="translate(970, 690)">
    <!-- Ashoka Lion Emblem silhouette -->
    <g fill="#0f172a" transform="translate(0, -38) scale(0.6)">
      <path d="M-12,0 C-12,-8 -8,-16 0,-20 C8,-16 12,-8 12,0 Z" />
      <circle cx="0" cy="-24" r="5" />
      <rect x="-8" y="2" width="16" height="4" />
      <text x="0" y="16" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="9" font-weight="700">सत्यमेव जयते</text>
      <text x="0" y="28" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="10" font-weight="700">GOVERNMENT OF INDIA</text>
    </g>

    <!-- MSME Block Logo -->
    <g transform="translate(0, 18)">
      <!-- MSME stylized letters -->
      <g fill="#1e3a8a">
        <rect x="-42" y="0" width="18" height="24" rx="2" />
        <rect x="-20" y="0" width="18" height="24" rx="2" />
        <rect x="2" y="0" width="18" height="24" rx="2" />
        <rect x="24" y="0" width="18" height="24" rx="2" />
      </g>
      <text x="0" y="16" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="13" font-weight="900" fill="#ffffff" letter-spacing="4">
        MSME
      </text>
      <text x="0" y="32" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="6.5" font-weight="700" fill="#475569" letter-spacing="0.5">
        MINISTRY OF MICRO, SMALL &amp; MEDIUM ENTERPRISES
      </text>
    </g>
  </g>
</svg>
