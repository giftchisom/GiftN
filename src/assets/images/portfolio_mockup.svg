<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820">
  <defs>
    <linearGradient id="ipad-screen-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04010a" />
      <stop offset="50%" stop-color="#070210" />
      <stop offset="100%" stop-color="#0f0521" />
    </linearGradient>

    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Clip path for circular avatar -->
    <clipPath id="avatar-clip">
      <circle cx="950" cy="420" r="105" />
    </clipPath>
  </defs>

  <!-- iPad Air 4 Body / Screen Canvas -->
  <rect width="1200" height="820" fill="url(#ipad-screen-bg)" />

  <!-- TOP STATUS BAR -->
  <rect x="0" y="0" width="1200" height="28" fill="#000000" opacity="0.4" />
  <text x="24" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">
    September Monday at 3:10 PM
  </text>
  <!-- WiFi & Battery (Top Right) -->
  <g transform="translate(1140, 10)" fill="#e2e8f0">
    <!-- WiFi curves -->
    <path d="M-30,10 A8,8 0 0,1 -18,10 M-34,6 A14,14 0 0,1 -14,6 M-38,2 A20,20 0 0,1 -10,2" fill="none" stroke="#e2e8f0" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="-24" cy="12" r="1.5" fill="#e2e8f0" />
    <!-- Battery outline -->
    <rect x="0" y="0" width="22" height="11" rx="2.5" fill="none" stroke="#e2e8f0" stroke-width="1.2" />
    <rect x="2" y="2" width="16" height="7" rx="1.5" fill="#22c55e" />
    <path d="M23,3.5 Q24,4 24,5.5 Q24,7 23,7.5" fill="#e2e8f0" />
  </g>

  <!-- SAFARI TOOLBAR -->
  <rect x="0" y="28" width="1200" height="50" fill="#120c1f" border-b="1" />
  <line x1="0" y1="78" x2="1200" y2="78" stroke="#2e1065" stroke-width="1" />

  <!-- Back / Forward Buttons -->
  <g transform="translate(30, 43)" stroke="#a855f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M12,4 L4,11 L12,18" />
    <path d="M34,4 L42,11 L34,18" />
    <!-- Bookmarks icon -->
    <path d="M72,4 L72,18 M84,4 L84,18 M72,4 Q78,7 84,4 M72,18 Q78,21 84,18" />
  </g>

  <!-- URL Bar (Center) -->
  <g transform="translate(340, 36)">
    <rect x="0" y="0" width="520" height="34" rx="17" fill="#1e1533" stroke="#4c1d95" stroke-width="1" />
    <text x="24" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#a855f7">
      AA
    </text>
    <!-- Lock icon -->
    <g transform="translate(180, 11)" fill="none" stroke="#94a3b8" stroke-width="1.2">
      <rect x="1" y="4" width="10" height="7" rx="1.5" fill="#94a3b8" />
      <path d="M3,4 L3,3 A3,3 0 0,1 9,3 L9,4" stroke="#94a3b8" />
    </g>
    <text x="200" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500" fill="#f1f5f9">
      giftn-rho.vercel.app
    </text>
    <!-- Refresh arrow -->
    <path d="M495,14 A5,5 0 1,1 490,19 M495,14 L498,17" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Right Safari Icons (Share, +, Tabs) -->
  <g transform="translate(930, 45)" stroke="#a855f7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Share icon -->
    <path d="M10,6 L10,-2 M6,2 L10,-2 L14,2 M4,4 L4,14 L16,14 L16,4" />
    <!-- Plus icon -->
    <path d="M70,6 L82,6 M76,0 L76,12" />
    <!-- Tabs icon -->
    <rect x="130" y="0" width="12" height="12" rx="2" />
    <rect x="134" y="4" width="12" height="12" rx="2" />
  </g>

  <!-- WEBPAGE INNER LAYOUT -->
  <!-- 1. LEFT SIDEBAR -->
  <g transform="translate(40, 130)">
    <!-- Header -->
    <text x="0" y="20" font-family="'Montserrat', sans-serif" font-size="20" font-weight="900" fill="#ffffff" letter-spacing="2">
      GIFT NNEJI
    </text>
    <text x="0" y="42" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#c084fc" letter-spacing="2">
      FULL STACK DEVELOPER
    </text>

    <!-- Bio -->
    <text x="0" y="75" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8" width="160">
      <tspan x="0" dy="0">Product-minded engineer crafting</tspan>
      <tspan x="0" dy="16">secure, real-time, and AI-enabled</tspan>
      <tspan x="0" dy="16">digital ecosystems.</tspan>
    </text>

    <!-- Navigation Tree Links -->
    <g transform="translate(0, 160)">
      <!-- Vertical connecting line -->
      <line x1="8" y1="10" x2="8" y2="170" stroke="#581c87" stroke-width="1.5" />
      
      <!-- INTRO (Active) -->
      <circle cx="8" cy="10" r="4.5" fill="#a855f7" stroke="#ffffff" stroke-width="1.5" />
      <text x="24" y="14" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#e9d5ff" letter-spacing="1">
        INTRO
      </text>

      <!-- ABOUT & SKILLS -->
      <circle cx="8" cy="62" r="3" fill="#1e1035" stroke="#7e22ce" stroke-width="1.5" />
      <text x="24" y="66" font-family="'Space Mono', monospace" font-size="10" font-weight="600" fill="#a855f7" letter-spacing="1">
        ABOUT &amp; SKILLS
      </text>

      <!-- EXPERIENCE -->
      <circle cx="8" cy="114" r="3" fill="#1e1035" stroke="#7e22ce" stroke-width="1.5" />
      <text x="24" y="118" font-family="'Space Mono', monospace" font-size="10" font-weight="600" fill="#a855f7" letter-spacing="1">
        EXPERIENCE
      </text>

      <!-- FEATURED PROJECTS -->
      <circle cx="8" cy="166" r="3" fill="#1e1035" stroke="#7e22ce" stroke-width="1.5" />
      <text x="24" y="170" font-family="'Space Mono', monospace" font-size="10" font-weight="600" fill="#a855f7" letter-spacing="1">
        FEATURED PROJECTS
      </text>
    </g>

    <!-- Social / Contact Icons & Details -->
    <g transform="translate(0, 440)">
      <g fill="#94a3b8">
        <circle cx="6" cy="6" r="2.5" />
        <circle cx="26" cy="6" r="2.5" />
        <circle cx="46" cy="6" r="2.5" />
        <circle cx="66" cy="6" r="2.5" />
      </g>
      <text x="0" y="32" font-family="'Space Mono', monospace" font-size="8" fill="#64748b">
        Lomé, Togo
      </text>
      <text x="0" y="48" font-family="'Space Mono', monospace" font-size="8" fill="#64748b">
        giftchisomwork@gmail.com
      </text>
      <text x="0" y="64" font-family="'Space Mono', monospace" font-size="8" fill="#64748b">
        (+228) 70800377
      </text>
    </g>
  </g>

  <!-- 2. MAIN HERO SECTION -->
  <g transform="translate(380, 180)">
    <!-- Status Pill -->
    <g transform="translate(0, 0)">
      <circle cx="4" cy="4" r="3" fill="#a855f7" />
      <text x="14" y="8" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#d8b4fe" letter-spacing="2">
        OPEN TO NEW PROJECTS
      </text>
    </g>

    <!-- Heading: Hi, I'm Gift Nneji| -->
    <text x="0" y="65" font-family="'Montserrat', sans-serif" font-size="48" font-weight="900" fill="#ffffff" letter-spacing="-1">
      Hi, I'm
    </text>
    <text x="0" y="125" font-family="'Montserrat', sans-serif" font-size="52" font-weight="900" fill="#c084fc" letter-spacing="-1">
      Gift Nneji<tspan fill="#a855f7">|</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="180" font-family="'Inter', sans-serif" font-size="24" font-weight="600" fill="#f8fafc">
      Full-Stack Software
    </text>
    <text x="0" y="215" font-family="'Inter', sans-serif" font-size="24" font-weight="600" fill="#f8fafc">
      Developer
    </text>

    <!-- Fun Fact Card -->
    <g transform="translate(0, 245)">
      <rect x="0" y="0" width="340" height="95" rx="14" fill="#0c0418" stroke="#3b0764" stroke-width="1.2" />
      <text x="16" y="24" font-family="'Space Mono', monospace" font-size="9" font-weight="700" fill="#a855f7" letter-spacing="1">
        # FUN FACT
      </text>
      <!-- Dots -->
      <g transform="translate(260, 20)" fill="#7e22ce">
        <circle cx="0" cy="0" r="1.5" />
        <circle cx="8" cy="0" r="1.5" />
        <circle cx="16" cy="0" r="1.5" />
        <circle cx="24" cy="0" r="1.5" />
      </g>
    </g>

    <!-- CTA Buttons -->
    <g transform="translate(0, 375)">
      <!-- "View My Work →" Button -->
      <rect x="0" y="0" width="165" height="46" rx="12" fill="#7e22ce" />
      <text x="82" y="28" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#ffffff">
        View My Work →
      </text>

      <!-- "✉ Contact Me" Button -->
      <rect x="185" y="0" width="155" height="46" rx="12" fill="#0d041e" stroke="#581c87" stroke-width="1.2" />
      <text x="262" y="28" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">
        ✉ Contact Me
      </text>
    </g>
  </g>

  <!-- 3. RIGHT PORTRAIT ORBITAL SHOWCASE -->
  <g transform="translate(950, 420)">
    <!-- Orbital Rings & Particles -->
    <ellipse cx="0" cy="0" rx="160" ry="160" fill="none" stroke="#3b0764" stroke-width="1" opacity="0.6" />
    <ellipse cx="0" cy="0" rx="140" ry="140" fill="none" stroke="#581c87" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.8" />
    <ellipse cx="0" cy="0" rx="118" ry="118" fill="none" stroke="#9333ea" stroke-width="2" opacity="0.9" />

    <!-- Orbital Glowing Dots -->
    <circle cx="-135" cy="-45" r="4" fill="#c084fc" />
    <circle cx="140" cy="30" r="3" fill="#a855f7" />
    <circle cx="-20" cy="138" r="3.5" fill="#e9d5ff" />

    <!-- Circular Profile Frame -->
    <circle cx="0" cy="0" r="105" fill="#f8fafc" stroke="#a855f7" stroke-width="3" />
    
    <!-- Profile Image Embedded via ClipPath -->
    <image href="/profile.png" x="-105" y="-120" width="210" height="250" preserveAspectRatio="xMidYMid slice" clip-path="url(#avatar-clip-inner)" />
    
    <!-- Inner clip definition for local transform -->
    <clipPath id="avatar-clip-inner">
      <circle cx="0" cy="0" r="103" />
    </clipPath>
  </g>

  <!-- Bottom Floating Action Button (Purple Target) -->
  <g transform="translate(1120, 750)">
    <circle cx="0" cy="0" r="26" fill="#a855f7" shadow="0 0 15px #a855f7" />
    <circle cx="0" cy="0" r="12" fill="none" stroke="#ffffff" stroke-width="2" />
    <circle cx="0" cy="0" r="4" fill="#ffffff" />
  </g>
</svg>
